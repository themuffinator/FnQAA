// FnQAA's PC defaults. The engine runs this file right after Quake Arena
// Arcade's own default.cfg, which it reads from the player's package and
// never ships. Configs the player saved run after both, so they still win.
// Shipped in FnQAA-pkg.fnz beside the engine (scripts/build_root_archive.py).

// QAA: PC deviation: the keyboard and the mouse, as Quake Live's default.cfg,
// with QAA's commands where QL's differ. Left out, as QAA has no such
// command: the arrows' dropflag, dropweapon, droppowerup and droprune, F3's
// readyup, h's +chat, v's +voice, p's +acc and PAUSE's pause; and 0's
// "weapon 14", the heavy machinegun, which QAA does not have. The arrows are
// the pad's D-pad (controlschemes), so they stay unbound here.
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +moveup
bind c +movedown
bind SHIFT +speed
bind MOUSE1 +attack
bind f lastweap				// QL: "weapon toggle"
bind ] weapnext
bind MWHEELDOWN weapnext
bind [ weapprev
bind MWHEELUP weapprev
bind MOUSE2 +zoom
bind ENTER +button2
bind MOUSE3 +button2
bind g +button3
bind k kill
bind TAB +scores
bind F1 "vote yes"
bind F2 "vote no"
bind F11 screenshotJPEG
bind t messagemode
bind y messagemode2
bind ESCAPE togglemenu
bind ~ toggleconsole
bind ` toggleconsole
bind 1 "weapon 1"
bind 2 "weapon 2"
bind 3 "weapon 3"
bind 4 "weapon 4"
bind 5 "weapon 5"
bind 6 "weapon 6"
bind 7 "weapon 7"
bind 8 "weapon 8"
bind 9 "weapon 9"
bind MOUSE4 "weapon 10"
bind DEL +lookdown
bind PGDN +lookup
bind END centerview
bind KP_INS "follow 0"
bind KP_END "follow 1"
bind KP_DOWNARROW "follow 2"
bind KP_PGDN "follow 3"
bind KP_LEFTARROW "follow 4"
bind KP_5 "follow 5"
bind KP_RIGHTARROW "follow 6"
bind KP_HOME "follow 7"
bind KP_UPARROW "follow 8"
bind KP_PGUP "follow 9"

// QAA: PC deviation: the pad's move stick, which retail reads unbound.
// Retail moves and looks with the sticks in the engine. The look stick is
// read so here too (CL_PadLookMove, with xSensitivity, ySensitivity and
// m_pitch); the move stick, the left one unless cl_southpaw swaps them, is
// bound, and in_joystickUseAnalog makes these binds analog.
bind PAD0_LEFTSTICK_UP +forward
bind PAD0_LEFTSTICK_DOWN +back
bind PAD0_LEFTSTICK_LEFT +moveleft
bind PAD0_LEFTSTICK_RIGHT +moveright
